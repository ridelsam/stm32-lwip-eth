<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 - Courier Misdelivered</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #031b33;
      color: #f7edcf;
      font: 18px/1.6 Georgia, "Times New Roman", serif;
    }
    article {
      width: min(650px, 90%);
      border: 3px solid #d5aa4d;
      background: #0b2a47;
      box-shadow: 12px 12px 0 #020d18;
      padding: 36px;
      text-align: center;
    }
    .code { color: #d5aa4d; font: bold 80px/1 Arial, sans-serif; }
    h1 { margin: 10px 0; font-size: 36px; }
    p { color: #d6dedf; }
    a {
      display: inline-block;
      margin-top: 15px;
      border: 2px solid #d5aa4d;
      color: #f7edcf;
      padding: 10px 18px;
      text-decoration: none;
    }
    a:hover { background: #d5aa4d; color: #031b33; }
  </style>
</head>
<body>
  <article>
    <div class="code">404</div>
    <h1>The pigeon returned without your page.</h1>
    <p>The requested document may have been eaten, nested upon, or accidentally routed through UDP where nobody acknowledged its arrival.</p>
    <p>A formal inquiry has been opened. It will be ignored in the order received.</p>
    <a href="index.html">Return to Bureau headquarters</a>
  </article>
</body>
</html>
